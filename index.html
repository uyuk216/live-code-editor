<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Live Code Editor</title><link rel="stylesheet" href="style.css"></head><body>
<div id="app"><header><strong>⌘ Live Code</strong><button id="menuFiles" data-i="files">▣ ファイル</button><button id="menuPreview" data-i="preview">▶ プレビュー</button><button id="paletteBtn" data-i="commands">⌕ コマンド</button><button id="langBtn">EN</button><button id="settingsBtn" data-i="settings">⚙ 設定</button></header><div class="layout"><aside id="sidebar"><nav><button data-view="files" data-i="files">▣ ファイル</button><button data-view="search" data-i="search">⌕ 検索</button><button data-view="extensions" data-i="extensions">◇ 拡張機能</button><button data-view="help" data-i="help">ⓘ 使い方</button></nav><section id="sideContent"></section></aside><main><div id="tabs"></div><div id="editorWrap"><div id="lines"></div><div id="codeArea"><pre id="highlight" aria-hidden="true"></pre><textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Code editor"></textarea><div id="currentLine"></div><div id="completion" hidden></div></div></div><div id="findBar" hidden><input id="findInput" placeholder="Find"><input id="replaceInput" placeholder="Replace"><button id="findNext">↓</button><button id="replaceOne" data-i="replace">置換</button><button id="replaceAll" data-i="replaceAll">全置換</button><button id="findClose">×</button></div><section id="panel"><div id="panelTabs"><button data-panel="preview" data-i="preview">プレビュー</button><button data-panel="console" data-i="console">コンソール <b id="errorBadge"></b></button><button data-panel="problems" data-i="problems">問題</button><button id="refreshBtn" title="Refresh" aria-label="Refresh preview">↻</button><button id="openPreviewBtn" data-i="openPreview" title="Open preview in new tab">↗</button></div><iframe id="previewFrame" sandbox="allow-scripts" title="Preview"></iframe><div id="consolePane" hidden></div><div id="problemsPane" hidden></div></section></main></div><footer><span id="statusLanguage"></span><span id="position"></span><span id="saveState"></span></footer></div>
<dialog id="settingsDialog"><form method="dialog"><h2 data-i="settings">設定</h2><label><span data-i="theme">テーマ</span><select id="themeSetting"><option value="dark">Dark</option><option value="light">Light</option></select></label><label><span data-i="fontSize">文字サイズ</span><input id="fontSetting" type="number" min="11" max="28"></label><label><span data-i="wrap">折り返し</span><input id="wrapSetting" type="checkbox"></label><label><span data-i="autoPreview">プレビュー自動更新</span><input id="previewSetting" type="checkbox"></label><label><span data-i="language">言語</span><select id="languageSetting"><option value="ja">日本語</option><option value="en">English</option></select></label><label><span data-i="author">作者名</span><input id="authorSetting" maxlength="80"></label><p id="aboutText"></p><button data-i="close">閉じる</button></form></dialog>
<dialog id="paletteDialog"><input id="paletteInput" placeholder="Command"><div id="paletteResults"></div><button id="paletteClose" data-i="close">閉じる</button></dialog><input id="fileInput" type="file" multiple hidden><input id="jsonInput" type="file" accept=".json,application/json" hidden><input id="packInput" type="file" accept=".json,application/json" hidden><script src="app.js"></script></body></html>
