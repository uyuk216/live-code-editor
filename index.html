<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Live Code Editor</title><link rel="stylesheet" href="style.css"></head><body>
<div id="app"><header><strong>⌘ Live Code</strong><button id="menuFiles" data-i="files">▣ ファイル</button><button id="menuPreview" data-i="preview">▶ プレビュー</button><button id="paletteBtn" data-i="commands">⌕ コマンド</button><button id="langBtn">EN</button><button id="settingsBtn" data-i="settings">⚙ 設定</button></header><div class="layout"><aside id="sidebar"><nav><button data-view="files"><span class="navIcon">▣</span></button><button data-view="search"><span class="navIcon">⌕</span></button><button data-view="extensions"><span class="navIcon">◇</span></button><button data-view="help"><span class="navIcon">ⓘ</span></button></nav><section id="sideContent"></section></aside><div id="splitS"></div><main><div id="topRow"><div id="editorCol"><div id="editorWrap"><div class="gCol focused" id="col1"><div class="tabBar" id="tabsBar"><div class="tabStrip" id="tabs"></div><button id="splitBtn" title="エディタを分割">◫</button></div><div class="group" id="group1"><div class="gLines" id="lines"></div><div class="codeArea" id="codeArea"><pre class="gHl" id="highlight" aria-hidden="true"></pre><textarea class="gEd" id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Code editor"></textarea><div class="gCur" id="currentLine"></div><div id="completion" hidden></div><div id="welcome" hidden><div class="welcomeLogo">⌘</div><div class="welcomeTitle">Live Code</div><div class="welcomeList"><button data-welcome="palette"><span data-i="commands">コマンド</span><kbd>Ctrl/⌘+Shift+P</kbd></button><button data-welcome="new"><span data-i="newFile">新規ファイル</span><kbd>⌘N</kbd></button><button data-welcome="add"><span data-i="addFile">PCから追加</span><kbd>⌘O</kbd></button><button data-welcome="sample"><span data-i="sample">サンプル</span></button><button data-welcome="blank"><span data-i="blank">まっさらなWeb</span></button><button data-welcome="counter"><span data-i="counter">ボタンカウンター</span></button><button data-welcome="help"><span data-i="help">使い方</span></button></div></div></div></div></div><div id="splitEditor" hidden></div><div class="gCol" id="col2" hidden><div class="tabBar" id="tabsBar2"><div class="tabStrip" id="tabs2"></div></div><div class="group" id="group2"><div class="gLines" id="lines2"></div><div class="codeArea" id="codeArea2"><pre class="gHl" id="highlight2" aria-hidden="true"></pre><textarea class="gEd" id="editor2" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Code editor 2"></textarea><div class="gCur" id="currentLine2"></div></div></div></div></div><div id="findBar" hidden><input id="findInput" placeholder="Find"><input id="replaceInput" placeholder="Replace"><button id="findNext">↓</button><button id="replaceOne" data-i="replace">置換</button><button id="replaceAll" data-i="replaceAll">全置換</button><button id="findClose">×</button></div></div><div id="splitV"></div><section id="panel"><div id="panelTabs"><span class="panelTitle" data-i="preview">プレビュー</span><button id="refreshBtn" title="Refresh" aria-label="Refresh preview">↻</button><button id="openPreviewBtn" data-i="openPreview" title="Open preview in new tab">↗</button><button id="closePreviewBtn" title="プレビューを閉じる">×</button></div><iframe id="previewFrame" sandbox="allow-scripts" title="Preview"></iframe></section></div><div id="splitH"></div><section id="consolePanel"><div id="consoleHead"><span data-i="console">コンソール</span><b id="errorBadge"></b><button id="clearConsoleBtn" data-i="clearConsole">コンソールをクリア</button></div><div id="consolePane"></div></section></main></div><footer><span id="position"></span><span id="saveState"></span></footer></div>
<dialog id="settingsDialog"><form method="dialog"><h2 data-i="settings">設定</h2><label><span data-i="theme">テーマ</span><select id="themeSetting"><option value="dark">Dark</option><option value="light">Light</option></select></label><label><span data-i="fontSize">文字サイズ</span><input id="fontSetting" type="number" min="11" max="28"></label><label><span data-i="wrap">折り返し</span><input id="wrapSetting" type="checkbox"></label><label><span data-i="autoPreview">プレビュー自動更新</span><input id="previewSetting" type="checkbox"></label><label><span data-i="language">言語</span><select id="languageSetting"><option value="ja">日本語</option><option value="en">English</option></select></label><label><span data-i="author">作者名</span><input id="authorSetting" maxlength="80"></label><p id="aboutText"></p><button data-i="close">閉じる</button></form></dialog>
<dialog id="paletteDialog"><input id="paletteInput" placeholder="Command"><div id="paletteResults"></div><button id="paletteClose" data-i="close">閉じる</button></dialog><input id="fileInput" type="file" multiple hidden><input id="jsonInput" type="file" accept=".json,application/json" hidden><input id="packInput" type="file" accept=".json,application/json" hidden><script src="app.js"></script></body></html>
